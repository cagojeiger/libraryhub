name: Authorize LibraryHub CI execution
description: Validate the request and this public execution using pinned private control
inputs:
  client-id:
    description: Client ID of the App installed on LibraryHub Core
    required: true
  private-key:
    description: Private key of the Core reader App
    required: true
  core-control-revision:
    description: Reviewed full commit SHA containing the private CI control
    required: true
  dispatch-actor-id:
    description: Expected GitHub numeric user ID of the dispatch App bot
    required: true
  source-run-id:
    description: Private workflow run ID
    required: true
  source-attempt:
    description: Private workflow run attempt
    required: true
  request-digest:
    description: Digest of the validated source-free CI request
    required: true
  claim-nonce:
    description: Immutable dispatch reservation nonce
    required: true
outputs:
  tested-sha:
    description: Exact validated private source commit
    value: ${{ steps.gate.outputs.tested_sha }}
runs:
  using: composite
  steps:
    - name: Require a configured control revision
      shell: bash
      env:
        CORE_CONTROL_REVISION: ${{ inputs.core-control-revision }}
      run: '[[ "$CORE_CONTROL_REVISION" =~ ^[a-f0-9]{40}$ ]]'

    - name: Mint private metadata token
      id: metadata
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: cagojeiger
        repositories: libraryhub-core
        permission-contents: read
        permission-actions: read
        skip-token-revoke: true

    - name: Checkout pinned private CI control
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: cagojeiger/libraryhub-core
        ref: ${{ inputs.core-control-revision }}
        token: ${{ steps.metadata.outputs.token }}
        path: .control
        sparse-checkout: /.github/ci/
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Verify the immutable request and public run
      id: gate
      shell: bash
      env:
        CORE_TOKEN: ${{ steps.metadata.outputs.token }}
        PUBLIC_TOKEN: ${{ github.token }}
        CORE_CONTROL_REVISION: ${{ inputs.core-control-revision }}
        PUBLIC_CI_REVISION: ${{ github.sha }}
        DISPATCH_ACTOR_ID: ${{ inputs.dispatch-actor-id }}
        CORE_RUN_ID: ${{ inputs.source-run-id }}
        CORE_ATTEMPT: ${{ inputs.source-attempt }}
        REQUEST_DIGEST: ${{ inputs.request-digest }}
        CLAIM_NONCE: ${{ inputs.claim-nonce }}
      run: python3 .control/.github/ci/bridge.py gate

    - name: Revoke the private metadata token
      if: ${{ always() && steps.metadata.outputs.token != '' }}
      shell: bash
      env:
        CORE_READ_TOKEN: ${{ steps.metadata.outputs.token }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/revoke_core_token.sh"
